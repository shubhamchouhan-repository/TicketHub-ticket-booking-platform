server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5442/booking_db
    username: tickethub
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  kafka:
    consumer:
      # S4: Booking now CONSUMES Payment events, in its own consumer group
      group-id: booking-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      concurrency: 3
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # a Kafka outage must never hang a confirmation request for long
        max.block.ms: 3000
        request.timeout.ms: 2000
        delivery.timeout.ms: 5000

booking:
  # S3: how often the outbox relay looks for unpublished events
  outbox:
    relay-interval-ms: 1000
  # S4: non-blocking retries for payment events (4 attempts, waits 2s, 4s, 8s)
  retry:
    attempts: 4
    delay-ms: 2000
    multiplier: 2.0
  reservation-expiry-minutes: 10
  max-seats-per-booking: 6
  expiry-sweep-interval-ms: 15000

tickethub:
  kafka:
    booking-confirmed-topic: booking-confirmed
    booking-events-topic: booking-events
    payment-events-topic: payment-events
  clients:
    event-service:
      base-url: http://event-service
      connect-timeout-ms: 1000
      read-timeout-ms: 3000

resilience4j:
  circuitbreaker:
    instances:
      eventService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.tickethub.booking.common.exception.ResourceNotFoundException
          - com.tickethub.booking.common.exception.BusinessRuleException
  retry:
    instances:
      eventService:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.tickethub.booking.common.exception.DependencyUnavailableException
          - com.tickethub.booking.common.exception.DependencyTimeoutException
