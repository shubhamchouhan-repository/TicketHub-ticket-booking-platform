spring:
  application:
    name: event-service
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true

# Only bootstrap values live here. Everything else comes from the Config Server.
# Secrets are read from environment variables and are never committed.
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{correlationId:-}]"

tickethub:
  media:
    # MinIO root credentials locally (docker-compose); on AWS leave empty to use the IAM role.
    access-key: ${MEDIA_S3_ACCESS_KEY:tickethub-minio}
    secret-key: ${MEDIA_S3_SECRET_KEY:tickethub-minio-secret}
