spring:
  application:
    name: payment-service
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true

# Only bootstrap values live here. Everything else comes from the Config Server.
# Secrets are read from environment variables and are never committed.
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{correlationId:-}]"

payment:
  webhook:
    secret: ${PAYMENT_WEBHOOK_SECRET}
  # Stripe TEST key, only used when the "stripe" profile is active (ST-22)
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
