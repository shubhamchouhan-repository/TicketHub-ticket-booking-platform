name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test every service
        run: mvn -B clean verify

  docker-images:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images
        env:
          POSTGRES_PASSWORD: ci-only
          PAYMENT_WEBHOOK_SECRET: ci-only
          JWT_SECRET: ci-only-ci-only-ci-only-ci-only-ci-only
          TICKETHUB_TAG: ${{ github.sha }}
        run: docker compose build

  integration:
    # Starts the real stack and runs the production-style flows against it (ST-62, ST-08, ST-33).
    runs-on: ubuntu-latest
    needs: docker-images
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Start the stack
        run: docker compose up -d --build
      - name: Smoke test
        run: bash scripts/smoke-test.sh
      - name: End-to-end flow
        run: bash scripts/e2e.sh
      - name: Concurrency test (one seat, many customers)
        run: bash scripts/concurrency-test.sh 20
      - name: Show logs when something failed
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
